# Throwaway spike (CLAUDE.md "Risk spikes"): not a workspace member, never promoted as-is.
[package]
name = "s_render"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
bevy = { version = "0.20", default-features = false, features = [
    "std",
    "async_executor",
    "multi_threaded",
    "bevy_winit",
    "bevy_window",
    "x11",
    "wayland",
    "bevy_asset",
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_pbr",
    "bevy_post_process",
    "bevy_anti_alias",
    "bevy_gizmos_render",
    "bevy_state",
    "keyboard",
    "mouse",
    "gestures",
    "png",
    "tonemapping_luts",
    "smaa_luts",
    "ktx2",
    "zstd_rust",
    "bevy_log",
] }

# GPU-free shader validation: translate composed WGSL to every backend.
naga = { version = "30.0.1", features = ["wgsl-in", "spv-out", "msl-out", "hlsl-out"] }

[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
